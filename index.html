<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caleb Pogyor — High Tide — Mix Review</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#080808;color:#ddd6cc;font-family:'DM Mono','Courier New',monospace;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.012) 2px,rgba(255,255,255,.012) 4px);pointer-events:none;z-index:9999}

  .hero{background:#000;border-bottom:1px solid #1e1e1e;padding:1.75rem 2rem;display:flex;align-items:center;gap:1.5rem}
  .hero-logo{width:110px;height:auto;flex-shrink:0;mix-blend-mode:lighten;filter:brightness(1.1)}
  .hero-text{flex:1;min-width:0}
  .hero-artist{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(28px,5vw,46px);letter-spacing:.08em;color:#dc3214;line-height:1;margin-bottom:.15rem}
  .hero-title{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(16px,3vw,24px);letter-spacing:.08em;color:#fff;line-height:1;margin-bottom:.25rem}
  .hero-sub{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#3a3a3a}

  .body{max-width:820px;margin:0 auto;padding:2rem 1.25rem 3rem}
  .content{display:grid;grid-template-columns:160px 1fr;gap:1.5rem;align-items:start}
  @media(max-width:560px){.content{grid-template-columns:1fr}}
  .album-cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block;box-shadow:0 4px 30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);position:sticky;top:1.5rem}

  .tracks{display:flex;flex-direction:column;gap:7px}
  .track-card{background:#111;border:1px solid #1e1e1e;border-left:3px solid #1e1e1e;border-radius:5px;overflow:hidden;transition:border-left-color .2s}
  .track-card.playing{border-left-color:#dc3214;background:#141414}
  .track-top{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
  .track-top:hover .track-title{color:#fff}
  .track-num{font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;color:#252525;text-align:center;line-height:1}
  .track-card.playing .track-num{color:#dc3214}
  .track-info{min-width:0}
  .track-title{font-size:13px;font-weight:500;color:#e0d8ce;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;transition:color .15s}
  .track-status{font-size:9px;color:#2e2e2e;letter-spacing:.1em;text-transform:uppercase}
  .track-card.playing .track-status{color:#dc3214}
  .track-actions{display:flex;gap:5px;flex-shrink:0}
  .icon-btn{background:none;border:1px solid #222;border-radius:4px;color:#444;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;text-decoration:none;flex-shrink:0}
  .icon-btn:hover{color:#ddd6cc;border-color:#444;background:#1a1a1a}
  .icon-btn.play-btn:hover{border-color:#dc3214;color:#dc3214}
  .track-card.playing .icon-btn.play-btn{background:#dc3214;border-color:#dc3214;color:#fff}
  svg.icon{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .player-bar{border-top:1px solid #1a1a1a;padding:10px 14px;display:none;background:#0d0d0d}
  .track-card.playing .player-bar{display:flex;align-items:center;gap:10px}
  .prog-wrap{flex:1;display:flex;flex-direction:column;gap:4px}
  .prog-track{width:100%;height:3px;background:#222;border-radius:2px;cursor:pointer;position:relative}
  .prog-fill{height:100%;background:#dc3214;border-radius:2px;width:0%;pointer-events:none;transition:width .1s linear}
  .time-row{display:flex;justify-content:space-between;font-size:9px;color:#333;letter-spacing:.05em}
  .vol-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
  input[type=range]{-webkit-appearance:none;appearance:none;width:60px;height:3px;background:#222;border-radius:2px;outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#dc3214;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#dc3214;cursor:pointer;border:none}
  .note{font-size:10px;color:#1e1e1e;letter-spacing:.1em;text-align:center;margin-top:2rem;line-height:2}
</style>
</head>

<script>
  var TRACKS = [
  {name: '00 Around the Bend, The Ocean Spoke', url: 'https://www.dropbox.com/scl/fi/on4nu900mq1a5jpny2lhf/00-Around-the-Bend-The-Ocean-Spoke-TSTMAST.wav?rlkey=zio7d7f2h95immxe6a6iqmqll&st=p8xeguve&dl=1'},
  {name: '01 Watcher on the Hill', url: 'https://www.dropbox.com/scl/fi/wd1yhq5gslb6jqi9ntu7t/01-Watcher-TSTMAST.wav?rlkey=cvqo25ev872ycctw7cdsfpl3x&st=muu4rqxe&dl=1'},
  {name: '02 My Bones', url: 'https://www.dropbox.com/scl/fi/garwmo8oij15thgbuibe1/02-My-Bones-TSTMAST.wav?rlkey=vkzihg24jqvtbch55bzsc0mst&st=hxee5ml4&dl=1'},
  {name: '03 In a Moment', url: 'https://www.dropbox.com/scl/fi/bssumuc0neb4i0ikd5k2e/03-In-a-Moment-TSTMAST.wav?rlkey=73qq3qmyaf660umgy6z18buog&st=quyyxvgd&dl=1'},
  {name: '04 The River', url: 'https://www.dropbox.com/scl/fi/tte4w2mi8fwcq2ri057u3/04-The-River-TSTMAST.wav?rlkey=u665u4n9ruk46eld3mvt24q00&st=tqbrew0z&dl=1'},
  {name: '05 Visionary Harvest', url: 'https://www.dropbox.com/scl/fi/r9s15vop54bjuoybjrzfm/05-Visionary-Harvest-TSTMAST.wav?rlkey=pzeachrpi6nfxvq3druk0r0p4&st=385lewdt&dl=1'},
  {name: '06 Past the Point', url: 'https://www.dropbox.com/scl/fi/z0sje8985jf1f2qmhn0qm/06-Past-the-Point-TSTMAST.wav?rlkey=5r1pkvx0t8ipn71ej53nxbxq9&st=dk7nd5qx&dl=1'},
  {name: '07 Mullusk', url: 'https://www.dropbox.com/scl/fi/cx5665wvubnfjw45sc04v/07-Mullusk-TSTMAST.wav?rlkey=7olteis0cfas8urqls54k54f8&st=rw1qu44i&dl=1'},
  {name: '08 High Tide', url: 'https://www.dropbox.com/scl/fi/rikscbucad9pvdlkw151t/08-High-Tide-TSTMAST.wav?rlkey=bxc3t0ivs14oktkw48x458oo3&st=pm0wr9kv&dl=1'},
  {name: '09 Finite', url: 'https://www.dropbox.com/scl/fi/2s0uxusmq46mamkm5jznk/09-Finite-TSTMAST.wav?rlkey=m81vub9lqpvpuievouur0ghrv&st=9fxaopfn&dl=1'}
];
  var currentIdx = null;
  var audio = new Audio();

  function fmt(s) {
    if (!s || isNaN(s)) return '0:00';
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function playTrack(idx) {
    if (idx < 0 || idx >= TRACKS.length) return;
    currentIdx = idx;
    audio.src = TRACKS[idx].url;
    audio.load();
    audio.play().catch(function() {});
    render();
    var card = document.getElementById('card-' + idx);
    if (card) card.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  function togglePlay(idx) {
    if (currentIdx === idx && !audio.paused) {
      audio.pause(); render();
    } else if (currentIdx === idx && audio.paused) {
      audio.play(); render();
    } else {
      playTrack(idx);
    }
  }

  audio.addEventListener('ended', function() {
    if (currentIdx !== null && currentIdx + 1 < TRACKS.length) {
      playTrack(currentIdx + 1);
    } else {
      currentIdx = null; render();
    }
  });

  audio.addEventListener('timeupdate', function() {
    var fill = document.getElementById('prog-fill');
    var cur = document.getElementById('time-cur');
    var dur = document.getElementById('time-dur');
    if (fill) fill.style.width = (audio.duration ? (audio.currentTime / audio.duration * 100) : 0) + '%';
    if (cur) cur.textContent = fmt(audio.currentTime);
    if (dur) dur.textContent = fmt(audio.duration);
  });

  audio.addEventListener('play', function() { render(); });
  audio.addEventListener('pause', function() { render(); });

  function seek(e) {
    var rect = e.currentTarget.getBoundingClientRect();
    var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    if (audio.duration) audio.currentTime = pct * audio.duration;
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var PLAY_ICON  = '<svg class="icon" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>';
  var PAUSE_ICON = '<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
  var DL_ICON    = '<svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
  var VOL_ICON   = '<svg class="icon" style="color:#333;flex-shrink:0" viewBox="0 0 24 24"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>';

  function render() {
    var list = document.getElementById('track-list');
    list.innerHTML = TRACKS.map(function(t, i) {
      var isActive = currentIdx === i;
      var isPlaying = isActive && !audio.paused;
      var num = (i + 1 < 10 ? '0' : '') + (i + 1);
      var statusText = isPlaying ? '&#9658; Now playing' : (isActive ? '&#9646;&#9646; Paused' : 'Click to play');
      var dlUrl = t.url.replace('dl=1','dl=1');

      var card = '<div class="track-card' + (isActive ? ' playing' : '') + '" id="card-' + i + '">';
      card += '<div class="track-top" onclick="togglePlay(' + i + ')">';
      card += '<div class="track-num">' + num + '</div>';
      card += '<div class="track-info"><div class="track-title">' + esc(t.name) + '</div>';
      card += '<div class="track-status">' + statusText + '</div></div>';
      card += '<div class="track-actions" onclick="event.stopPropagation()">';
      card += '<button class="icon-btn play-btn" onclick="togglePlay(' + i + ')" title="' + (isPlaying ? 'Pause' : 'Play') + '">' + (isPlaying ? PAUSE_ICON : PLAY_ICON) + '</button>';
      card += '<a class="icon-btn" href="' + esc(dlUrl) + '" download title="Download">' + DL_ICON + '</a>';
      card += '</div></div>';
      if (isActive) {
        card += '<div class="player-bar">';
        card += '<div class="prog-wrap">';
        card += '<div class="prog-track" onclick="seek(event)"><div class="prog-fill" id="prog-fill"></div></div>';
        card += '<div class="time-row"><span id="time-cur">0:00</span><span id="time-dur">0:00</span></div>';
        card += '</div>';
        card += '<div class="vol-wrap">' + VOL_ICON + '<input type="range" min="0" max="1" step="0.02" value="1" oninput="audio.volume=this.value"></div>';
        card += '</div>';
      }
      card += '</div>';
      return card;
    }).join('');
  }

  render();
</script>
